name: Publish to PyPI and npm

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.13.5"
          python-version: "3.12.15"
      
      - name: Set up Python
        run: uv python install 3.12.15
      
      - name: Install dependencies
        run: uv sync --frozen --dev
      
      - name: Validate server.json
        run: uv run python scripts/validate_server_manifest.py ../server.json

      - name: Load sample data into PostgreSQL
        env:
          PGPASSWORD: test
        run: psql -h localhost -U test -d test -f scripts/init_sample_db.sql

      - name: Run tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        run: uv run pytest -v --run-integration

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.13.5"
          python-version: "3.12.15"
      
      - name: Build package
        working-directory: python
        run: uv build
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

  # npm trusted publishing: npm exchanges the GitHub OIDC token for a
  # short-lived publish credential, so no npm token is stored anywhere. The
  # trust relationship on npmjs.com names this file (publish.yml) and the
  # `npm` environment; renaming either breaks publishing.
  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write  # Required for trusted publishing and provenance
    defaults:
      run:
        working-directory: typescript

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          registry-url: 'https://registry.npmjs.org'

      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($version)"
            exit 1
          fi

      # Trusted publishing needs npm 11.5.1+. Pinned rather than relying on
      # whatever the Node image bundles: a too-old npm would fail here after
      # PyPI has already published, leaving the registries out of step.
      - name: Use npm 11.13.0
        run: npm install -g npm@11.13.0 && npm -v

      # Dependencies' install scripts don't run in a job that can mint a
      # publish credential. The package's own prepublishOnly (the build) still
      # runs during npm publish.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Publish to npm
        run: npm publish
