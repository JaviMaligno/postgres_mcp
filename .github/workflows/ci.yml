name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-python:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    strategy:
      matrix:
        python-version: ["3.11.17", "3.12.15"]
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python-version }}
      
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: uv sync --frozen --dev --python ${{ matrix.python-version }}
      
      - name: Load sample data into PostgreSQL
        env:
          PGPASSWORD: test
        run: psql -h localhost -U test -d test -f scripts/init_sample_db.sql
      
      - name: Run tests with coverage
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        run: uv run --frozen --python ${{ matrix.python-version }} pytest -v --run-integration ${{ github.ref == 'refs/heads/main' && '--cov=postgres_mcp --cov-report=term-missing --cov-report=xml' || '' }}
      
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12.15' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          files: python/coverage.xml
          fail_ci_if_error: false

  test-typescript:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    strategy:
      # Exercise the two patched supported Node release lines.
      matrix:
        node-version: ['22.23.4', '24.22.1']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Load sample data
        env:
          PGPASSWORD: test
        run: psql -h localhost -U test -d test -f ../python/scripts/init_sample_db.sql
      # No continue-on-error: the TypeScript side has real tests now, so a
      # failure here has to fail the build like the Python one does.
      - run: node node_modules/vitest/vitest.mjs run --maxWorkers=2
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.13.5"
          python-version: "3.12.15"
      
      - name: Set up Python
        run: uv python install 3.12.15
      
      - name: Install dependencies
        run: uv sync --frozen --dev
      
      # Both steps used to carry continue-on-error, which made this job report
      # green over 22 lint errors and 13 unformatted files. Those are fixed, so
      # the gate is real now.
      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Lint with ruff
        run: uv run ruff check .

  build-python:
    runs-on: ubuntu-latest
    needs: test-python
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.13.5"
          python-version: "3.11.17"
      
      - name: Build package
        run: uv build
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: python/dist/

  draft-typescript:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  verify-docker:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    strategy:
      matrix:
        implementation: [python, typescript]
    steps:
      - uses: actions/checkout@v4
      - name: Build local source image without publishing
        run: docker build -t mcp-local -f ${{ matrix.implementation }}/Dockerfile ${{ matrix.implementation }}
      - name: Verify Python local distribution
        if: matrix.implementation == 'python'
        run: docker run --rm --entrypoint /app/.venv/bin/python mcp-local -c "import importlib.metadata; d = importlib.metadata.distribution('postgresql-mcp'); import json; assert json.loads(d.read_text('direct_url.json'))['url'] == 'file:///app'; print(d.version, importlib.metadata.version('mcp'))"
      - name: Verify Node runtime
        if: matrix.implementation == 'typescript'
        run: docker run --rm --entrypoint node mcp-local -e "if (process.versions.node !== '24.22.1') process.exit(1); console.log(process.versions.node)"
